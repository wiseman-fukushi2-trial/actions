name: Toko

on:
  # 各モジュールから呼び出されたときに実行
  workflow_call:

jobs:
  build:
    runs-on: self-hosted
    steps:
      # リポジトリをクローン・チェックアウト
      - name: Checkout
        id: checkout
        uses: wiseman-fukushi2-trial/actions/actions/checkout@DX-RKuji

      # 変更を取得
      # ${{ steps.diff.outputs.changed_projects }} : 差分プロジェクトの .vbproj のリスト
      - name: Get Diff
        id: diff
        uses: wiseman-fukushi2-trial/actions/actions/diff@DX-RKuji

      # ビルド
      - name: Build
        id: build
        uses: wiseman-fukushi2-trial/actions/actions/build@DX-RKuji
        with:
          project-files: ${{ steps.diff.outputs.changed_projects }}

  file-check:
    runs-on: self-hosted
    steps:
      # リポジトリをクローン・チェックアウト
      # ${{ steps.checkout.outputs.branch }} : 対象のブランチ名
      # ${{ steps.checkout.outputs.sha }} : 対象のコミット SHA
      - name: Checkout
        id: checkout
        uses: wiseman-fukushi2-trial/actions/actions/checkout@DX-RKuji

      - name: run
        shell: pwsh
        run: |
          Write-Host "branch: ${{ steps.checkout.outputs.branch }}"
          Write-Host "sha: ${{ steps.checkout.outputs.sha }}"


      # 変更を取得
      # ${{ steps.diff.outputs.changed_files }} : 差分ファイルのリスト
      # ${{ steps.diff.outputs.changed_projects }} : 差分プロジェクトの .vbproj のリスト
      - name: Get Diff
        id: diff
        uses: wiseman-fukushi2-trial/actions/actions/diff@DX-RKuji

      # ファイルチェック
      - name: File Check
        id: file-check
        uses: wiseman-fukushi2-trial/actions/actions/file-check@DX-RKuji
        with:
          branch: ${{ steps.checkout.outputs.branch }}
          sha: ${{ steps.checkout.outputs.sha }}
          files: ${{ steps.diff.outputs.changed_files }}
          project-files: ${{ steps.diff.outputs.changed_projects }}
