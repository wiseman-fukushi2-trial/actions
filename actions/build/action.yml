name: Build
description: ビルド

inputs:
  project-files:
    description: 処理対象の .vbproj のリスト
    required: true

runs:
  using: composite

  steps:
    - name: Build SortProjects.exe
      shell: cmd
      run: |
        dotnet build "${{ github.action_path }}/SortProjects/SortProjects.csproj" -c Release -p:OutDir="${{ github.action_path }}/SortProjects/bin/"

    - name: Sort
      id: sort_projects
      shell: cmd
      run: |
        "${{ github.action_path }}/SortProjects/bin/SortProjects.exe" ${{ github.workspace }} ${{ inputs.project-files }}

    - name: Build
      shell: cmd
      run: |
          echo ${{ inputs.project-files }}
          pwsh "${{ github.action_path }}/BuildProjects.ps1" ${{ steps.sort_projects.outputs.sorted_projects }}
