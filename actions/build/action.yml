name: Build
description: ビルド

inputs:
  project-files:
    description: 処理対象の .vbproj のリスト
    required: true

runs:
  using: composite

  steps:
    - name: Sort
      shell: cmd
      run: |
        dotnet-script "${{ github.action_path }}/SortProjects.csx" ${{ github.workspace }} ${{ inputs.project-files }}

    - name: Build
      shell: cmd
      run: |
          echo ${{ inputs.project-files }}
          "${{ github.action_path }}/BuildProjects.ps1" ${{ inputs.project-files }}
