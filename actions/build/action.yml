name: Build
description: ビルド

inputs:
  project-files:
    description: 処理対象プロジェクトファイルのリスト
    required: true

runs:
  using: composite

  steps:
    - name: Build
      shell: pwsh
      run: |
          Write-Host ${{ inputs.project-files }}
          & "${{ github.action_path }}/BuildProjects.ps1" ${{ inputs.project-files }}
