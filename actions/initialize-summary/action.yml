name: Initialize Summary
description: サマリーの初期化

runs:
  using: composite

  steps:
    - name: Initialize Summary
      shell: cmd
      run: |
          echo "# 投稿確認" >> $GITHUB_STEP_SUMMARY

    - name: check
      shell: pwsh
      run: |
        Write-Host "GITHUB_STEP_SUMMARY=$env:GITHUB_STEP_SUMMARY"
        "# 投稿確認" >> $env:GITHUB_STEP_SUMMARY
        Get-Content $env:GITHUB_STEP_SUMMARY
