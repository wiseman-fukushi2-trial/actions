name: Checkout
description: 呼び出し元リポジトリのチェックアウト

runs:
  using: composite

  steps:
    # 呼び出し元リポジトリをクローン
    - name: Checkout Caller Repository
      uses: actions/checkout@v7.0.1
      with:
        # チェックアウトするブランチを指定
        # プルリクエスト：source のブランチ
        # それ以外：現在のブランチ
        ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

    - name: Output
      shell: pwsh
      run: |
        $type = '${{ github.event.name }}'
        $base = '${{ github.event.pull_request.base.ref || github.ref_name }}'
        $head = '${{ github.event.pull_request.head.ref || github.ref_name }}'
        $baseUrl = "${{ github.server_url }}/${{ github.repository }}/tree/$base"
        $headUrl = "${{ github.server_url }}/${{ github.repository }}/tree/$head"
        $array = @(
          "** $type **"
          "[$base]($baseUrl)"
          ' ⇐ '
          "[$head]($headUrl)"
        )
        $text = $array -join ' '
        $text | Add-Content -NoNewline $env:GITHUB_STEP_SUMMARY
